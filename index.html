<!DOCTYPE html>
<html>
  
  <head>
    <title>Page Title</title>
    <meta charset="UTF-8">
  </head>
  
  <body>
    <h1>Test</h1>

    <script>
      async function fetchData() {
        try {
          // 1. Wait for the server headers and response status
          const response = await fetch('https://dmitrybelkevich.github.io/city_17/database/data.json');
          
          // 2. Check if the HTTP status code is successful (200-299)
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          
          // 3. Wait for the full body data to download and parse as JSON
          const data = await response.json();
          console.log(data);
          
          } catch (error) {
          // 4. Handle network errors or parsing issues
          console.error('Fetch failed:', error);
        }
      }
      
      fetchData();

      class User {
        constructor(name, age) {
        this.name = name;
        this.age = age;
        }
      }
      
      const user1 = new User("Bob", 30);
    </script>
  </body>
  
</html>
