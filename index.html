<!DOCTYPE html>
<html>
  
  <head>
    <title>Page Title</title>
    <meta charset="UTF-8">
    
    <script>
      class Song {
        constructor(id, band, title, text, score, playback) {
          this.id = id;
          this.band = band;
          this.title = title;
          this.text = text;
          this.score = score;
          this.playback = playback;
        }
      }
      
      var song;
      var id = 5;

      class songDao {
        async loadData() {
          try {
            // 1. Wait for the server headers and response status
            const response = await fetch('database/songs.json');
            
            // 2. Check if the HTTP status code is successful (200-299)
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            
            // 3. Wait for the full body data to download and parse as JSON
            const data = await response.json();
            // console.log(data);
            
            return data;
          } catch (error) {
            // 4. Handle network errors or parsing issues
            console.error('Fetch failed:', error);
          }
        }

        async getById(id) {
          const data = await loadData();
          const result = data.find(s => s.id == id) || null;
  
          if (!result)
            return null;
            
          song = new Song(result.id, result.band, result.title, result.text, result.score, result.playback);
          
          return song;
        }
      }
      
      async function run() {
        const songDao = new SongDao();
        song = await songDao.getById(id);
      }

      run();
    </script>
    
  </head>
  
  <body>
    <h1>Test</h1>
  </body>
  
</html>
