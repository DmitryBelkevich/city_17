<!DOCTYPE html>
<html>

  <head>
    <title>Page Title</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">
    
    <script>
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const id = urlParams.get('id');
    </script>

	<script>
		// get model from database by id
		const song = {
			id: 5,
			band: "Альянс",
			title: "На заре",
			text: "../texts/na_zare",
			score: "https://drive.google.com/file/d/1Ozb6GofzZKNbIv5GFti6CTKxG8Qk9BkF/view?usp=drive_link",
			playback: "https://drive.google.com/drive/folders/17ms-kVQLzpbdPwm3XT1st-mGT8hTtOwM?usp=drive_link"
		};
	</script>
  </head>

  <body>
	<div id="settings"></div>
	  
	<div id="title"></div>
	  
	<div id="tabs"></div>
	
	<div id="tuning"></div>
	
	<div id="content"></div>
	
	<div id="footer">Copyright © Dmitry Belkevich</div>
	  
	<script>
		// set title
		const container = document.getElementById('title');

		const header1 = document.createElement('h1');
		header1.textContent = song.title;
		container.append(header1);

		const header2 = document.createElement('h2');
		header2.textContent = song.band;
		container.append(header2);
	</script>

    <script>
      // set content
      
      // Fetch the external HTML file
      var path = song["text"];
      
      fetch(path)
        .then(response => {
        if (!response.ok) {
        throw new Error('Network response was not ok');
      }
        return response.text(); // Convert the file content to text
      })
      .then(data => {
        // Insert the text content as HTML into your placeholder
        const element = document.getElementById('content');
        element.innerHTML = data;
      })
      .catch(error => console.error('Error loading the HTML file:', error));
    </script>
  </body>

</html>
