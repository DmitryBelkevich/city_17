<!DOCTYPE html>
<html>

  <head>
    <title>Page Title</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">
    
    <script>
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const id = urlParams.get('id');

      // get model from database by id
      var song = {
        id: 5,
        band: "Альянс",
        title: "На заре",
        "text&chords": "../songs/na_zare",
        score: "https://drive.google.com/file/d/1Ozb6GofzZKNbIv5GFti6CTKxG8Qk9BkF/view?usp=drive_link",
        playback: "https://drive.google.com/drive/folders/17ms-kVQLzpbdPwm3XT1st-mGT8hTtOwM?usp=drive_link"
      };
    </script>
  </head>

  <body>
    <div id="title">
			<h1></h1>
			<h2></h2>
		</div>

    <div id="content"></div>

    <script>
      // set content
      
      // Fetch the external HTML file
      var path = song["text&chords"];
      
      fetch(path)
        .then(response => {
        if (!response.ok) {
        throw new Error('Network response was not ok');
      }
        return response.text(); // Convert the file content to text
      })
      .then(data => {
        // Insert the text content as HTML into your placeholder
        const element = document.getElementById('content');
        element.innerHTML = data;
      })
      .catch(error => console.error('Error loading the HTML file:', error));
    </script>
  </body>

</html>
