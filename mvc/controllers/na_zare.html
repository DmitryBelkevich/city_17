<!DOCTYPE html>
<html>

  <head>
    <title>Page Title</title>
    <meta charset="UTF-8">
  </head>

  <body>
    <h1>Альянс - На заре:</h1>

    <div id="content"></div>

    <script>
      // Fetch the external HTML file
      fetch('//mvc/models/song')
        .then(response => {
        if (!response.ok) {
        throw new Error('Network response was not ok');
      }
        return response.text(); // Convert the file content to text
      })
      .then(data => {
        // Insert the text content as HTML into your placeholder
        const element = document.getElementById('content');
        element.innerHTML = data;
      })
      .catch(error => console.error('Error loading the HTML file:', error));
    </script>
  </body>

</html>
